[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "template", name = "git-tpl lint", language = "system", entry = "mise run lint:template", pass_filenames = false },
  { id = "markdown", name = "Markdown", language = "system", entry = "mise run lint:markdown", files = "^README\\.md$", pass_filenames = false },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint-system" }]
