name: Template CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  template:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libreadline-dev
      - uses: jdx/mise-action@v4
      - run: mise run lint
      - run: mise run test
      - run: prek run --all-files
